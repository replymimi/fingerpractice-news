name: 財經晨讀主更新

on:
  schedule:
    - cron: '15 22 * * *'  # 06:15 台北時間觸發，目標 07:00 前上線
  workflow_dispatch:

permissions:
  contents: write

env:
  run_type: main

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查倉庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 抓新聞 RSS
        run: python scripts/fetch_news.py

      - name: 抓大盤指數
        run: python scripts/fetch_market.py

      - name: 抓潮汐板塊資料
        run: python scripts/fetch_tide.py

      - name: 抓台股籌碼（三大法人、融資融券、自選股）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/fetch_chips.py

      # 波段條件檢查頁：任何一步失敗都不擋晨讀上線
      - name: 抓全市場行情（波段條件檢查用）
        continue-on-error: true
        run: python scripts/fetch_stock_history.py

      - name: 找出爆大量股票
        continue-on-error: true
        run: python scripts/volume_surge.py

      - name: 產生波段條件檢查頁（加密）
        continue-on-error: true
        env:
          PICKS_PASSWORD: ${{ secrets.PICKS_PASSWORD }}
          WATCHLIST_URL: ${{ secrets.WATCHLIST_URL }}
        run: python scripts/build_picks.py

      - name: 抓 YouTube 影片（除游庭皓外全部）
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: python scripts/fetch_youtube.py --run-type main

      - name: AI 翻譯與摘要
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/summarize.py

      - name: 產生網頁
        run: python scripts/build_page.py

      - name: 提交更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/raw data/cache data/state data/stocks docs/index.html docs/picks
          git diff --cached --quiet || git commit -m "🤖 自動更新財經晨讀（main）"
          for i in 1 2 3 4 5; do
            git push origin main && exit 0
            echo "push rejected, pulling and retrying ($i/5)"
            git pull --rebase origin main
            sleep $((RANDOM % 10 + 1))
          done
          git push origin main
