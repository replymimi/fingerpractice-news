# 財經晨讀 - 內容來源設定
# 修改這個檔案就能增減來源，不用碰程式碼。

# 標題關鍵字（整詞比對，只比標題）：沒有財經專屬 feed 的來源用它擋掉非財經新聞
finance_keywords: &finance_keywords
  - fed
  - federal reserve
  - rate
  - inflation
  - cpi
  - ppi
  - gdp
  - market
  - stock
  - bond
  - yield
  - dollar
  - currency
  - oil
  - crude
  - treasury
  - economy
  - economic
  - recession
  - jobs
  - payroll
  - unemployment
  - earnings
  - ipo
  - s&p
  - nasdaq
  - dow jones
  - crypto
  - bitcoin
  - tariff
  - trade deal
  - trade war
  - debt
  - deficit
  - housing
  - retail sales
  - consumer spending
  - ecb
  - boj
  - pboc
  - powell
  - central bank
  - wall street
  - hedge fund
  - stimulus
  - bailout
  - default
  - credit
  - mortgage
  - bank
  - stocks
  - shares
  - rates
  - yields
  - bonds
  - markets
  - banks
  - tariffs
  - layoffs

news:
  stocks:
    - id: reuters
      name: Reuters
      # Reuters 自己已無公開 RSS，改用 Google News 彙整其 reuters.com/business 文章
      feed_url: https://news.google.com/rss/search?q=site:reuters.com+business&hl=en-US&gl=US&ceid=US:en
    - id: cnbc
      name: CNBC
      feed_url: https://www.cnbc.com/id/100003114/device/rss/rss.html
    - id: marketwatch
      name: MarketWatch
      # 注意：mw_realtimeheadlines / marketpulse 這兩個「財經專屬」feed 都已經停更（最新只到 2025 年），
      # 不能用。目前還在更新的只有 topstories（混有民生消費新聞），所以用標題關鍵字過濾。
      feed_url: https://feeds.marketwatch.com/marketwatch/topstories/
      topic_keywords: *finance_keywords
    - id: zerohedge
      name: Zero Hedge
      # Zero Hedge 官方只有這一種全站 RSS，沒有財經專屬版本，內容本來就混雜政治／社會新聞
      # 用關鍵字過濾，只留跟財經/總經相關的標題
      feed_url: https://cms.zerohedge.com/fullrss2.xml
      topic_keywords: *finance_keywords
    - id: calculatedrisk
      name: Calculated Risk
      # 作者 2026-01 結束每日部落格，改發電子報（房地產為主）；舊的 Blogger/FeedBurner feed 停在 2026-01-12
      feed_url: https://calculatedrisk.substack.com/feed
  crypto:
    - id: coindesk
      name: CoinDesk
      feed_url: https://www.coindesk.com/arc/outboundfeeds/rss/
    - id: cointelegraph
      name: Cointelegraph
      feed_url: https://cointelegraph.com/rss
    - id: theblock
      name: The Block Research
      feed_url: https://www.theblock.co/rss.xml
    - id: bankless
      name: Bankless
      feed_url: https://www.bankless.com/feed

youtube:
  stocks:
    - id: youtinghao
      name: 游庭皓的財經皓角
      handle: "@yutinghaofinance"
      note: "直播 08:30-09:30，需在 10:00 補抓場次"
      supplemental_run: true
    - id: nicolasyoung
      name: 尼可拉斯楊Live精
      handle: "@nicolasyounglive"
  crypto: []

tide:
  base_url: https://tide-tw.app/data
  files:
    - latest.json
    - daily_brief.json
    - daily_digest.json

market_indices:
  us:
    - symbol: "^DJI"
      name: "道瓊工業指數 DJIA"
    - symbol: "^GSPC"
      name: "標普 500 S&P 500"
    - symbol: "^IXIC"
      name: "那斯達克 NASDAQ"
    - symbol: "^SOX"
      name: "費城半導體 SOX"
  tw:
    - symbol: "^TWII"
      name: "台股加權指數 TAIEX"
    # 櫃買指數：Yahoo 已查無 ^TWOII（404，舊快取曾凍結在 269.45 三週，實際約 427），改用櫃買中心官方 OpenAPI
    - id: TPEX
      provider: tpex
      name: "櫃買指數 TPEx"
    # TWD=X 的數字是「1 美元 = 幾元台幣」：數字變大 = 台幣貶值，所以用中性顏色、明講升貶，不用漲跌紅綠
    - symbol: "TWD=X"
      name: "美元兌台幣 USD/TWD"
      is_currency: true

# 台股籌碼面：三大法人、融資融券、自選股
# 全市場排行用證交所公開資料；大盤總額與自選股用 FinMind（免費，不用註冊也能跑）
tw_chips:
  top_n: 5            # 外資／投信買賣超各列前幾名
  watchlist:          # 自選股：要加減股票改這裡，id 是股票代號、name 是顯示名稱
    - id: "2330"
      name: 台積電
    - id: "2317"
      name: 鴻海
    - id: "2454"
      name: 聯發科
